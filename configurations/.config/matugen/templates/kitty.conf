shell zsh
font_family             family="JetBrainsMono Nerd Font"
bold_font               family="JetBrainsMono Nerd Font", style='Bold'
italic_font             family='JetBrainsMono Nerd Font' style='SemiBold Italic'
bold_italic_font        family='JetBrainsMono Nerd Font' style='Bold Italic'
font_size               13.0
disable_ligatures       never
remember_window_size    no
unicode_input           yes
shell_integration       enabled

url_color               {{colors.primary.default.hex}}
visual_bell_color       {{colors.error.default.hex}}
bell_border_color       {{colors.error_container.default.hex}}
active_border_color     {{colors.primary.default.hex}}
inactive_border_color   {{colors.outline_variant.default.hex}}
background              {{colors.surface.default.hex}}
foreground              {{colors.on_surface.default.hex}}
selection_foreground    {{colors.surface_container_highest.default.hex}}
selection_background    {{colors.on_surface.default.hex}}
active_tab_foreground   {{colors.on_primary_container.default.hex}}
active_tab_background   {{colors.primary_container.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
inactive_tab_background {{colors.surface_variant.default.hex}}
color0                  {{colors.surface_container_lowest.default.hex}}
color1                  {{colors.error.default.hex}}
color2                  {{colors.tertiary.default.hex}}
color3                  {{colors.secondary.default.hex}}
color4                  {{colors.primary.default.hex}}
color5                  {{colors.tertiary_container.default.hex}}
color6                  {{colors.secondary_container.default.hex}}
color7                  {{colors.on_surface_variant.default.hex}}
color8                  {{colors.outline.default.hex}}
color9                  {{colors.error_container.default.hex}}
color10                 {{colors.primary_container.default.hex}}
color11                 {{colors.inverse_primary.default.hex}}
color12                 {{colors.primary.default.hex}}
color13                 {{colors.on_tertiary_container.default.hex}}
color14                 {{colors.on_secondary_container.default.hex}}
color15                 {{colors.surface_bright.default.hex}}
